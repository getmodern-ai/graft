name: graft

# The self-hosted form, and the repository's development environment (GRA-33; ADR 0002, ADR 0013,
# ADR 0014). `docker compose pull` fetches the two published images — Graft, which is the server,
# the proxy, the MCP endpoint and the console in one, and the sandbox image sandboxes are created
# from — and `docker compose up` brings up Postgres and Graft over them. Both services keep a
# `build:` as well, so `docker compose up --build` builds this checkout's Dockerfiles over the
# tags instead, which is the path for someone patching an image. `pnpm run db:start`
# still brings up Postgres alone, for a server run from source on the host, through
# `docker-compose.dev.yml` beside this file. That overlay is the only thing that publishes the
# database on the host, and it publishes it on loopback alone (GRA-148).
#
# Values come from `.env` beside this file (`cp .env.example .env`; README, "Self-hosting"): the
# secrets Graft refuses to start without, the model key ADR 0014 requires of a self-host, and the
# admin opened on first start. Nothing below supplies a secret of its own: a default here would
# be a credential in a public repository, which is what GRA-148 took out. Everything in that file
# also reaches the `graft` container, so a server setting not named below
# (`GRAFT_PACKAGE_ALLOWLIST`, say) goes in `.env` and nowhere else.
#
# No `container_name` on purpose: the project name prefixes every container, network and volume,
# so `docker compose -p <name> up` runs a second copy beside the first — two checkouts on one
# laptop, or a test run beside a development one — and the two share nothing.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: graft
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    # No `ports` here on purpose (GRA-148): the `graft` service reaches Postgres by name on the
    # project's own network, so a self-host has no reason to publish the database, and publishing
    # it put a default password on every interface of the host. `docker-compose.dev.yml` publishes
    # it on loopback for a server run from source, and `pnpm run db:start` passes both files.
    volumes:
      - graft_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  graft:
    # The published image (`.github/workflows/release.yml`), pinned to a release rather than
    # following one: an `up` months after this checkout was taken runs the version its README was
    # written for, and upgrading is a tag in `.env` and a `pull`. `GRAFT_IMAGE_TAG=latest` follows
    # the newest release instead. A release moves this default, and the `sandbox` service below
    # takes its tag from the same name, since the two images are published together.
    image: ghcr.io/getmodern-ai/graft:${GRAFT_IMAGE_TAG:-0.1.0}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GRAFT_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # The fixed wiring of this compose file. Anything here wins over the same name in `.env`.
      GRAFT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/graft
      # The one origin the browser sees; Better Auth and every handoff URL are built on it. A
      # deployment behind a domain sets GRAFT_PUBLIC_URL in `.env`.
      GRAFT_AUTH_URL: ${GRAFT_PUBLIC_URL:-http://localhost:3000}
      GRAFT_CONSOLE_URL: ${GRAFT_PUBLIC_URL:-http://localhost:3000}
      # Sandboxes reach the proxy inside this container by the alias below, on the internal network
      # (`packages/sandbox-docker/README.md`, "Two arrangements"). The server's own port, not the
      # published one: this URL is resolved by containers, never by the host.
      GRAFT_PROXY_PUBLIC_URL: http://proxy:3000/api/proxy
      # The proxy's body cap on both legs is not named here: it reaches the container through
      # `.env` as GRAFT_PROXY_MAX_BODY_BYTES (default 10 MiB, floor 1 MiB) and is raised only by
      # an operator whose tools move larger files (GRA-183). Each call may hold that much memory.
      # The sandbox backing's pair: the image the `sandbox` service below leaves on the daemon and
      # the internal network as compose names it — `<project>_sandbox`, so a second project on one
      # daemon gets its own. This default and that service's `image` are the same reference on
      # purpose: the server creates sandboxes by this name, so a name that differed from what was
      # pulled would have it create them from an image nobody fetched.
      GRAFT_SANDBOX_IMAGE: ${GRAFT_SANDBOX_IMAGE:-ghcr.io/getmodern-ai/graft-sandbox:${GRAFT_IMAGE_TAG:-0.1.0}}
      GRAFT_SANDBOX_NETWORK: ${COMPOSE_PROJECT_NAME:-graft}_sandbox
      # The toolbox: one named volume, mounted here at GRAFT_TOOLBOX_ROOT (the image's default) and
      # into each sandbox by its own subpath, so the server's files and a sandbox's mount are one tree.
      # Compose names the `toolboxes` volume below `<project>_toolboxes`; this has to be that exact
      # name, and the backing refuses a name the daemon does not have rather than letting Docker
      # create a second, empty volume under it.
      GRAFT_TOOLBOX_VOLUME: ${COMPOSE_PROJECT_NAME:-graft}_toolboxes
      # The admin opened on first start (`GRAFT_ADMIN_EMAIL` and `GRAFT_ADMIN_PASSWORD`) is not
      # named here: it reaches the container through `.env` like every other setting, and a
      # default in this file would be a password anyone who has read the repository knows
      # (GRA-148). The keys script mints the password; the boot refuses a short or retired one.
    volumes:
      # Arrangement 1 of `packages/sandbox-docker/README.md`: the server creates sandboxes as
      # siblings on this daemon. Root-equivalent access to the host, the surface ADR 0002 accepts.
      # Arrangement 2, a `docker:dind` sibling, is described in the README under Self-hosting.
      - /var/run/docker.sock:/var/run/docker.sock
      - toolboxes:/var/lib/graft/toolboxes
    # The socket is `root:docker` on a Linux host and `root:root` under Docker Desktop, mode 660
    # either way; the server runs as an unprivileged user and needs the socket's group. `0` is
    # Docker Desktop's; on Linux set GRAFT_DOCKER_GID to `stat -c %g /var/run/docker.sock`.
    group_add:
      - "${GRAFT_DOCKER_GID:-0}"
    networks:
      default: {}
      sandbox:
        aliases:
          - proxy
    healthcheck:
      # No curl in the image; Node is.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Not a running service: the image every sandbox is created from, named here so `docker compose
  # pull` leaves it on the daemon under the name the `graft` service is handed, and buildable from
  # this package for someone patching it (`docker compose build sandbox`). `scale: 0` starts no
  # container from it. The tag is `GRAFT_IMAGE_TAG` again: the release publishes both images under
  # the same version, so the pair moves together.
  sandbox:
    image: ${GRAFT_SANDBOX_IMAGE:-ghcr.io/getmodern-ai/graft-sandbox:${GRAFT_IMAGE_TAG:-0.1.0}}
    build:
      context: packages/sandbox-docker
    scale: 0
    command: ["true"]
    networks:
      - sandbox

networks:
  default: {}
  # Where sandboxes live: no gateway, no external DNS, and the `graft` service under the alias
  # `proxy` as the only other member (ADR 0013). The backing refuses a network that is not internal.
  sandbox:
    internal: true

volumes:
  # Kept under this key so the database of a checkout that ran the Postgres-only compose file is the
  # same volume, `<project>_graft_postgres_data`, after this one.
  graft_postgres_data:
  # Every person's toolbox, one subdirectory each, as `<project>_toolboxes` — the name
  # GRAFT_TOOLBOX_VOLUME above spells out. Survives `docker compose down`; only
  # `docker compose down -v` or `docker volume rm` would remove it.
  toolboxes:
