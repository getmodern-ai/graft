<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The host names the theme over ui/initialize; this lets native controls follow either. -->
    <meta name="color-scheme" content="light dark" />
    <title>Graft</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- One waiting line until the tool result arrives (GRA-335), so the frame has its height before
         the script runs; then the card, or nothing for a result that is not an ask. card-view.ts
         draws the same line. -->
    <div id="ask"><p class="ask-waiting" role="status">Waiting for Graft…</p></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
