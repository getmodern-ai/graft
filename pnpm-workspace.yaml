packages:
  - apps/*
  - packages/*

# One version per shared dependency. A package declares `"typescript": "catalog:"` and gets the
# line pinned here, so two packages cannot drift onto two compilers or two test runners.
catalog:
  # TypeScript 7 is the Go-native compiler and its npm package ships `tsc` alone: none of the JS
  # compiler API (`createProgram`, `createSourceFile`) is in it. A package that needs that API — the
  # check will, when it arrives — pins the last JS-based line under an alias in its own
  # `package.json`, `"typescript6": "npm:typescript@~6.0.3"`, and imports `typescript6`, while `tsc`
  # for the repo stays on 7. That is Cando's arrangement (its `packages/api/package.json` and the
  # header of `module-check.core.ts` there); the alias is not catalogued until a package imports it.
  typescript: ^7
  # The Node 24 line, matching `engines.node` in the root `package.json`.
  "@types/node": ^26.5.1
  vitest: ^5.0.0
  # HTTP, the proxy's way out, tokens, schema validation and the validated environment, at the
  # versions Cando runs (ADR 0011): one line each so the proxy, the token and the server cannot
  # disagree about a compiler-visible type such as `Headers` or a JWT claim set.
  hono: ^4.13.3
  undici: ^8.10.2
  jose: ^6.2.4
  zod: ^4.4.3
  "@t3-oss/env-core": ^0.13.11
  # The Docker sandbox backing moves files in and out of a container as tar streams over the Engine
  # API (`packages/sandbox-docker/src/tar.ts`); this does the header arithmetic and the PAX records
  # for long paths. The types are a separate package, as they are for most of what predates TS.
  tar-stream: ^3.2.1
  "@types/tar-stream": ^3.1.4
  # The database and the account, at the versions Cando runs (ADR 0011). `drizzle-orm` and
  # `drizzle-kit` move together — a snapshot written by one kit version is read by the next, and the
  # ORM's column types are what the kit diffs — so both are pinned here rather than in `packages/db`
  # alone, where a second consumer could drift. `pg` is the driver both the ORM and Better Auth's
  # adapter ride; `better-auth` is exact because its schema is generated from the installed version
  # and a minor bump can add a column (`packages/db/src/schema/auth.ts` says how to regenerate).
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  pg: ^8.23.0
  "@types/pg": ^8.23.1
  better-auth: 1.7.2
  dotenv: ^17.4.2
  # The provider-backed model adapter (`@graft/model/provider`, ADR 0004, ADR 0014) speaks to a
  # provider through the AI SDK, at the major Cando runs (ADR 0011): `ai` for `generateText` with a
  # structured `Output`, one provider package each for Anthropic and for OpenAI — the latter also
  # covers an OpenAI-compatible gateway behind a base URL. No tracing vendor rides beside them: the
  # model telemetry seam's backing is the hosted form's (ADR 0002 as amended 2026-09-19).
  ai: ^7.0.94
  "@ai-sdk/anthropic": ^4.0.50
  "@ai-sdk/openai": ^4.0.62
  # The console (`apps/web`, GRA-26): React on Vite, TanStack Router and Query, Tailwind 4 and the
  # shadcn primitives generated into the app over Base UI — the versions Cando's web app runs
  # (ADR 0011), one line each. `better-auth` above is also the console's client (`better-auth/react`),
  # which is why the server and the console cannot disagree about a session's shape. Catalogued even
  # though one workspace consumes them today, so a second SPA — or a `packages/ui` if one ever earns
  # its keep — starts on the same lines rather than a second copy of each version.
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  vite: ^8.2.2
  "@vitejs/plugin-react": ^6.1.1
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tw-animate-css: ^1.4.0
  "@tanstack/react-router": ^1.170.33
  "@tanstack/react-query": ^5.102.8
  "@tanstack/router-plugin": ^1.168.36
  "@base-ui/react": ^1.8.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  sonner: ^2.0.8
  # The design system's three supporting packages (ADR 0017), at Cando's lines. `next-themes` is the
  # theme provider the console mounts in `__root.tsx`; `shadcn` is the CLI package, a devDependency
  # only because it ships `shadcn/tailwind.css`, which `apps/web/src/index.css` imports for the
  # `data-open`/`data-horizontal` variants the primitives are written against; and
  # `@material-symbols/svg-400` is the glyph source `apps/web/scripts/generate-icons.mjs` reads —
  # never imported at run time, since the generated `src/components/icons.tsx` embeds the paths.
  next-themes: ^0.4.6
  shadcn: ^4.19.0
  "@material-symbols/svg-400": ^0.47.0

# Overrides live here and not under `pnpm` in the root `package.json`: pnpm 11 no longer reads that
# field and pnpm 10 reads both, so this is the one placement both honour (AGENTS.md, "Conventions",
# has the argument for the pin itself; GRA-41). Drop the line when `pnpm why @esbuild-kit/core-utils`
# comes back empty.
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
