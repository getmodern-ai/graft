name: CI

on:
  # Every pull request, whatever its base. The launch is built as a stack (GRA-26 on GRA-23, GRA-28
  # on GRA-26, and so on), and with a `branches: [main]` filter here a stacked PR showed only the CLA
  # check until it was retargeted, so a reviewer approved it without a `Typecheck, Lint & Test`
  # result (GRA-37). The required check on `main` is unchanged; it merely runs earlier.
  pull_request:
  # `main` too: a pull request tests its own head, the merge commit is a different tree, and two
  # branches that each pass alone can still break once both are in. Copied from Cando, where the
  # gap was not hypothetical (its CAN-83).
  push:
    branches: [main]

# One run per ref, but `main` runs are never cancelled: consecutive merges share one ref, and
# cancelling would throw away the previous commit's result, which is the per-commit signal the
# push trigger exists to produce.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # This job name is the required status check in the repository ruleset. Renaming it blocks
    # every pull request on a check that no longer reports.
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # One suite needs a real database: `apps/server/src/database.integration.test.ts`, which applies
    # the migration chain to an empty Postgres and round-trips a person, an agent and a connection
    # with an encrypted credential. Injected fakes cannot show that the migration applies or that
    # the vault's ciphertext survives a `bytea` column. The suite skips itself when
    # `TEST_DATABASE_URL` is unset, so a developer without Docker is unaffected; under `CI` it fails
    # rather than skipping if this service is ever removed, which is what stops the coverage
    # evaporating silently.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graft_test
        ports:
          - 5432:5432
        # Without this the suite can start before Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Declared under `test.env` in `turbo.json`, or strict env mode would withhold it from vitest.
      # The suite creates a throwaway database per run on this server, so the named database is only
      # where it connects to do that.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/graft_test

    steps:
      - uses: actions/checkout@v7

      # A conflict marker inside a comment or a string is invisible to a typechecker and a linter.
      # The three labelled markers are anchored at the line start with an optional label tail;
      # `=======` is anchored at both ends so Markdown setext underlines under docs/ do not match.
      - name: Refuse merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|\|\|\|\|\|\|\|)( .*)?$|^=======$' -- ':!*.lock' ':!*.md'; then
            echo "conflict markers found" >&2
            exit 1
          fi

      # The documents the repo is made of are checked beside the code: every ADR carries a status,
      # the glossary and roadmap exist, and every ADR the roadmap or an ADR cites by number exists.
      # Before install, like the marker guard, because it reads the tree and nothing else.
      - name: Check the decision records
        run: |
          set -euo pipefail
          test -f CONTEXT.md
          test -f docs/roadmap.md
          for f in docs/adr/*.md; do
            head -3 "$f" | grep -q '^status: ' || { echo "$f has no status frontmatter" >&2; exit 1; }
          done
          # A citation numbered above our newest ADR is another repository's, Cando's in practice,
          # whose numbering runs ahead of ours. Name the repository in prose when citing one of
          # those; once the two sequences overlap this check cannot tell them apart.
          newest=$(ls docs/adr | sed -E 's/^([0-9]{4}).*/\1/' | sort | tail -1)
          for n in $(grep -rhoE 'ADR 00[0-9]{2}' docs README.md CONTEXT.md AGENTS.md | sed -E 's/ADR //' | sort -u); do
            [[ "$n" > "$newest" ]] && continue
            ls docs/adr/${n}-*.md >/dev/null 2>&1 || { echo "ADR ${n} is cited but does not exist" >&2; exit 1; }
          done

      # No `version` here: the action reads `packageManager` from the root `package.json`, so the
      # pnpm that wrote the committed lockfile is the pnpm that checks it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The three the job is named for, each its own step so a red run names what failed.
      - name: Typecheck
        run: pnpm run check-types

      # `biome ci` exits 0 on warnings, so a rule that must fail the build is set to `error` in
      # `biome.json`; `noFocusedTests` is the one promoted so far.
      - name: Lint
        run: pnpm run lint

      # `check-types` cannot see schema/migration drift: the schema and the code that reads it agree
      # with each other, and are both wrong about the database. Neither command below needs Postgres
      # — `generate` diffs the TypeScript schema against the last snapshot under `drizzle/meta`, and
      # `check` looks for two snapshots claiming the same parent, the collision two parallel branches
      # produce. Both, because `check` compares snapshots to each other and never the schema to them.
      # Run through `pnpm exec` from `packages/db`, because drizzle-kit is that package's dependency.
      # Stdin is `/dev/null` so a rename prompt — the one case `generate` asks a question — fails the
      # step instead of hanging the job. The tree is restored before the assertion, so the check
      # cannot leave an uncommitted migration behind for the steps that follow.
      - name: Check for schema/migration drift
        working-directory: packages/db
        run: |
          pnpm exec drizzle-kit check < /dev/null

          pnpm exec drizzle-kit generate < /dev/null
          drift="$(git status --porcelain -- drizzle)"
          git checkout -- drizzle
          git clean -fdq -- drizzle

          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo "::error::the schema has changes no migration captures; run \`pnpm run db:generate\` and commit the result"
            exit 1
          fi
          echo "Every schema change is captured by a migration."

      # The third of three guards, deliberately its own step: `drizzle-kit check` finds a fork, and
      # `generate` producing nothing means the schema matches the tip — neither finds a *hole*, a
      # journal entry whose `.sql` is absent, a snapshot missing from the middle, a `prevId` pointing
      # at nothing. `packages/db/src/migration-chain.ts` is what does, and `packages/db`'s own suite
      # asserts the committed chain too; this step names the failure where a red `Test` would not.
      - name: Check the migration chain for holes
        run: |
          if ! pnpm run db:check-chain; then
            echo "::error::the migration chain has a hole — see the lines above. This passes \`drizzle-kit check\` and fails when the migrations are applied."
            exit 1
          fi

      # The sandbox image is built here rather than inside the suite so that a broken Dockerfile is
      # its own red step, and so the suite tests the image CI built rather than one it found lying
      # around. `ubuntu-latest` ships a Docker daemon on the default socket, which is all the backing
      # needs (`packages/sandbox-docker/README.md`).
      - name: Build the sandbox image
        run: docker build -t graft-sandbox:ci packages/sandbox-docker

      # `pnpm run test` includes the Docker conformance suite, which under `CI` refuses to skip: a
      # green run here means the suite ran against the image the step above built. The variables are
      # declared under the `test` task in `turbo.json`, or strict env mode would withhold them.
      - name: Test
        run: pnpm run test
        env:
          GRAFT_SANDBOX_IMAGE: graft-sandbox:ci

      # The self-hosted image (GRA-33), built here so a broken Dockerfile or a bundle that no longer
      # resolves its imports is a red step on the pull request rather than a red release. Then the one
      # thing the image promises before it has a database: run with no environment, it refuses to
      # start and names the secrets it is missing (`packages/env/src/server.ts`). Both directions are
      # asserted — that it exited, and what it said — because a container that started with nothing
      # would be the worse failure, and one that exited for some other reason would hide behind a
      # green step. The model-key refusal ADR 0014 asks of a self-host arrives with GRA-31's rule.
      - name: Build the server image
        run: docker build -f apps/server/Dockerfile -t graft-server:ci .

      - name: The image refuses to start without its secrets, naming them
        run: |
          set -uo pipefail
          if output=$(docker run --rm graft-server:ci 2>&1); then
            echo "::error::the image started with no environment at all"
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          for name in GRAFT_DATABASE_URL GRAFT_AUTH_SECRET GRAFT_KEYRING_SECRET GRAFT_HANDOFF_SECRET; do
            grep -q "$name" <<<"$output" || { echo "::error::the refusal does not name $name" >&2; exit 1; }
          done
