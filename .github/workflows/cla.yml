name: CLA

# `CLA.md` at the repo root is what a contributor signs; ADR 0015 is why there is one. The bot
# records signatures as a JSON file on the `cla-signatures` branch, because `main` is protected
# and the bot cannot commit there.
#
# `pull_request_target`, not `pull_request`: a fork's `pull_request` run holds a read-only token
# that could not write a signature anywhere. `pull_request_target` runs this file from `main` with
# a write token, and that is safe only because nothing here checks out or executes the pull
# request's code; the action reads the pull request's authors and comments and writes one file.
# Keep it that way: no `actions/checkout` of the head, no install, no build.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    # `issue_comment` also fires on plain issues, and a comment there is not a signature.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          # The repository's own token is enough: the action needs a personal access token only
          # when the signatures live in another repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/getmodern-ai/graft/blob/main/CLA.md
          branch: cla-signatures
          # Bots hold no copyright. An entry without `*` is compared for equality, so the brackets
          # are literal; `*` is the action's one wildcard.
          allowlist: dependabot[bot],*[bot]
          # A merged pull request stays open to comments; Greptile edits its review in place and
          # follow-up discussion lands there.
          lock-pullrequest-aftermerge: false
